name: engine-build

# 阅读引擎 APK 构建（单产物）
# 触发: 推送 engine-v* 标签, 或手动 workflow_dispatch
# 产物: Release 附件 1 个 APK —— reading-engine-<版本>.apk (com.legado.app.release)
#
# ★2026-10-02 单产物化（用户指令）：本仓只出**一个** App —— 一个 Legado 系独立引擎，
#   小说/漫画/音乐/视频四类内容能力**全部保留**，不再按类型切 flavor。
#   原本的「五产物」工作流对应的 flavorDimensions + productFlavors 已从
#   app/build.gradle 整体删除；工作流若不同步，会在单测那一步死掉：
#     Cannot locate tasks that match ':app:testAppReleaseUnitTest'
#     （run 37025430862 实测，构建阶段根本没开始就红了）。
#   四个独立引擎各有各的上游（Venera / LX Music / TVBox），各自在自己的仓里出包，
#   不在本仓切分 —— 详见 docs/PLAN-4.56-ENGINES.md。
on:
  push:
    tags: ['engine-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          V=$(grep -m1 'def version = ' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$V" || { echo "::error::未能从 app/build.gradle 解析版本号"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "engine version = $V"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 写入签名密钥
        env:
          ENGINE_KEY_STORE: ${{ secrets.ENGINE_KEY_STORE }}
        run: |
          if [ -z "$ENGINE_KEY_STORE" ]; then
            echo "::error::缺少仓库密钥 ENGINE_KEY_STORE"; exit 1
          fi
          printf '%s' "$ENGINE_KEY_STORE" | base64 --decode > "$GITHUB_WORKSPACE/app/engine.jks"

      # 出厂源包是**构建输入**。这里不重新生成（生成脚本会写文件，且依赖本地采集产物），
      # 只做静态校验：源包存在、非空、条数量级合理。
      # 单产物化后只剩 `app/src/main` 一份全量源包（四类内容装在一起）。
      - name: 静态校验出厂源包
        run: |
          set -e
          node -e '
            const fs = require("fs");
            const p = "app/src/main/assets/defaultData/bookSources.json";
            const arr = JSON.parse(fs.readFileSync(p, "utf8"));
            if (!arr.length) { console.log("::error::出厂源包为空"); process.exit(1); }
            if (arr.length < 1000) { console.log("::error::出厂源包异常偏小: " + arr.length); process.exit(1); }
            const byType = {};
            for (const s of arr) { const t = s.bookSourceType ?? 0; byType[t] = (byType[t] || 0) + 1; }
            console.log("  ✓ 出厂源包 " + arr.length + " 条 (启用 " + arr.filter(s => s.enabled).length + ")");
            console.log("    按 bookSourceType 分布: " + JSON.stringify(byType));
          '

      - name: 单测（引擎更新通道决策层）
        run: |
          chmod +x gradlew
          # 只跑更新通道的纯决策层（变体选包 / 版本比较 / 说明兜底）。
          # 不跑全量单测：存量用例不属本次改动，别让它们挡住出包。
          # ★任务名随单产物化改为 `:app:testReleaseUnitTest`
          #   （无 flavor 时分变体名不再有 app/novel/... 前缀）。
          ./gradlew :app:testReleaseUnitTest \
            --tests "io.legado.app.help.update.EngineUpdateCheckTest" \
            --max-workers=2 --warning-mode=summary

      - name: 构建 Release APK
        env:
          ENGINE_KEY_PASSWORD: ${{ secrets.ENGINE_KEY_PASSWORD }}
          ENGINE_STORE_PASSWORD: ${{ secrets.ENGINE_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -ParmOnly=true \
            -PRELEASE_STORE_FILE=./engine.jks \
            -PRELEASE_STORE_PASSWORD="$ENGINE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS=reading-engine \
            -PRELEASE_KEY_PASSWORD="$ENGINE_KEY_PASSWORD" \
            --max-workers=2 --warning-mode=summary

      - name: 收集产物
        id: apk
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/reading-engine-$V.apk"
          ls -la out/
          echo "--- sha256 ---"
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: 校验产物
        run: |
          set -e
          WANT="${{ steps.ver.outputs.version }}"
          EXPECT_VCODE=$(echo "$WANT" | awk -F. '{printf "%d", $1*10000 + $2*100 + $3}')
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="out/reading-engine-$WANT.apk"
          echo "build-tools: $BT | 期望 versionName=$WANT versionCode=$EXPECT_VCODE"

          # 全量 badging 与首行分开存：首行(package:)给版本/包名用，
          # native-code 必须查**全量**输出 —— 见下面那条注释。
          BADGING_ALL=$("$BT/aapt2" dump badging "$APK" 2>/dev/null)
          BADGING=$(echo "$BADGING_ALL" | head -1)
          echo "$BADGING"

          echo "$BADGING" | grep -q "versionName='$WANT'" \
            || { echo "::error::versionName 不符, 期望 $WANT"; exit 1; }
          VCODE=$(echo "$BADGING" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")
          [ "$VCODE" = "$EXPECT_VCODE" ] \
            || { echo "::error::versionCode 不符, 实际 $VCODE 期望 $EXPECT_VCODE"; exit 1; }
          echo "$BADGING" | grep -q "package: name='com.legado.app.release'" \
            || { echo "::error::applicationId 不符, 期望 com.legado.app.release"; exit 1; }

          # 3) 关键组件齐全: 必须带 native 库(ABI 被静默丢弃时这里变红)。
          #    ★ 必须用 BADGING_ALL: `native-code:` 是 badging 的**最后一行**
          #      (实测 1.5.5 包在第 79 行, 前面还有若干空行)，而 BADGING 只留了
          #      head -1 的 package 行 —— 拿 "$BADGING" 去 grep 永远不命中。
          #      这正是 run #15 的失败原因: 五个 APK 全部构建成功、versionName/
          #      versionCode/包名全对，却报「缺 native-code」。改为全量输出后
          #      恢复成 run #12（单产物时期）那份能正常工作的写法。
          echo "$BADGING_ALL" | grep -q "native-code" \
            || { echo "::error::缺 native-code（ABI 可能被静默丢弃）"; exit 1; }
          echo "  ABI: $(echo "$BADGING_ALL" | grep 'native-code' | head -1)"

          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q "CN=Reading Engine" /tmp/certs.txt \
            || { echo "::error::签名证书不是本仓库密钥, 疑似用了上游公开密钥"; exit 1; }

          # ★ 出厂源包必须真的打进包里。
          node -e '
            const { execSync } = require("child_process");
            const apk = process.argv[1];
            const raw = execSync(`unzip -p "${apk}" assets/defaultData/bookSources.json`, { maxBuffer: 1 << 28 }).toString();
            const arr = JSON.parse(raw);
            if (!arr.length) { console.log("::error::包内出厂源包为空"); process.exit(1); }
            console.log("  ✓ 包内出厂源包 " + arr.length + " 条 (启用 " + arr.filter(s => s.enabled).length + ")");
          ' "$APK"

          echo "★ 产物校验通过"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('engine-v{0}', steps.ver.outputs.version) }}
          name: 阅读引擎 ${{ steps.ver.outputs.version }}
          body: |
            阅读引擎 ${{ steps.ver.outputs.version }}

            | 包 | 应用名 | 包名 | 内置源 |
            |----|--------|------|--------|
            | `reading-engine-${{ steps.ver.outputs.version }}.apk` | 小说引擎（四类内容） | com.legado.app.release | 全部类型 |

            ★ 单产物：一个 App 同时支持 **小说 / 漫画 / 音乐 / 视频** 四类内容，
            能力不切分、不阉割（`ENGINE_MODULES=novel,comic,music,video`）。

            - 本地书源解析引擎，局域网内即插即用
            - **首次打开需输入激活密码**（出厂默认 `123456`），未激活时内置源不入库、局域网前端搜不到内容
            - 实际可搜性取决于源站存活情况
            - 无需账号，不连接任何云端服务
            - THP/1 规范端点：`/thp/meta`、`/thp/m/{module}/search|toc|content`
            - 本版重点：**深搜（不断续搜）真正出包** + 深搜状态机三处缺陷修复
              （零推进保险丝跨请求持久化 / 单块预算上限 8s / 单源超时 30s→12s）。
              此前 1.10.0 发布的是**未含深搜的旧二进制**，表现为「搜几本就停 + 提示时间预算」。
          files: |
            out/reading-engine-${{ steps.ver.outputs.version }}.apk
            out/SHA256SUMS.txt
          draft: false
