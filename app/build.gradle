static def releaseTime() {
    return new Date().format("yyMMddHH", TimeZone.getTimeZone("GMT+8"))
}

def name = "thirdhub-engine-novel"
// 小说引擎（ThirdHub-Engine-Novel）自有版本线，与上游 Legado 版本号解耦。
// 本仓 = 上游「开源阅读 Legado 3.x」的**独立引擎**（非拆分之一）：一个开源项目 = 一个 App。
// 它天生支持 小说+漫画+音乐+视频 四类内容 —— 能力全部保留、不人为阉割（PLAN-4.56-ENGINES.md §一）。
// ★1.9.0（2026-10-02）：更新通道 —— 启动时拉自家引擎清单(downloads/engine/engines.json)，
//   发现新版本提示更新（下载 / 忽略此版本）；24 小时节流 + 「自动更新」开关，默认开。
//   上游 GitHub / 第三方 CDN 一律不接（见 EngineUpdateCheck / AppUpdateGitHub）。
//   CI 出包前跑 EngineUpdateCheckTest（变体选包 / 版本比较 / 说明兜底）。
// ★1.8.0（2026-10-01）：①免激活密码（EngineProfile.PASSWORD_GATE_ENABLED=false，
//   框架保留、日后一行改回）②搜索不再中途截断（预算上限 120s→1800s、新增 full=1、
//   更深一轮**累积合并**而非替换）。versionCode 由版本号推导 → 10800，单调递增。
// ★1.10.0（2026-10-02）：①「不断续搜」深度翻页搜索 —— 按块(chunk)补扫源、
//   源内翻页、真见底才 hasMore=false，治「几百/几千条就停止拉取」；断点续扫
//   不回头、结果旧前新后保序追加。②能力不设限 + 单产物化：本引擎天生支持
//   小说+漫画+音乐+视频 四类内容（全部保留、不阉割），且**不再按内容类型切
//   flavor** —— 一个开源项目只出一个 App（原来的 5 产物拆分已删除）。
//   搜索也不再按类型白名单卡源。versionCode 由版本号推导 → 11000，单调递增。
// ★1.11.0（2026-10-02）：**补发 1.10.0 的引擎二进制**。
//   ⚠️ 事故复盘：1.10.0 的「不断续搜」只改了本地源码、**从未推送**，随包发出的
//   app-release.apk 是当日 13:55 编的旧二进制（meta.version 仍报 1.5.5，行为上
//   hasMore 仍是 `from+limit<n`）→ 首屏 8s 只扫完 45/3660 个源、只出 28 条，
//   就被判 hasMore=false，前端第一页即停 = 用户报的「收几本就停 + 显示时间预算」。
//   本版把深搜真正出包，并修掉深搜自身三处缺陷：
//     ①零推进保险丝改为**跨请求持久化**（原来放局部变量，预算被死源块吃光后
//       deadline 先 break，保险丝永远攒不满 → sweepOffset 被钉死在同一块）；
//     ②单块预算设上限 8s（原来一块吃掉剩余全部预算 → 25s 请求最多只推进 128 源）；
//     ③深搜单源超时 30s → 12s（64 个并发槽被挂死源占满，是「源越多结果越少」之根）。
//   versionCode 由版本号推导 → 11101，单调递增、可覆盖安装。
//   ★1.12.0（2026-10-03）：搜索模式 + 流式。
//     · /thp/search 新增 mode=fuzzy|exact|deep（用户：「让引擎知道我们是想精确搜还是模糊搜」）
//       —— 上游本来就两种语义都有，过去只是**没有入口让调用方表达**。
//       exact 在**入缓存之前**按书名/作者是否含关键词收一道；deep 等同 full=1（不设时间上限）。
//     · 新增 stream=1 → application/x-ndjson 分块，**每扫完一块立刻推一行**。
//       治的是「等半天然后一下子冒出来」（实测单轮 12~22s 才有第一条）。
//       用户按停 = 断开连接，引擎侧写管道失败即自然收手。
//     · caps 新增 search-mode / stream-search（协议只增不减）。
//     versionCode 由版本号推导 → 11200。
// ★1.13.0（2026-10-03）：把「正文取不到」变成**可识别、可换源**的失败。
//   真机实测（模拟器 10 本样本）：目录全部正常，正文 5/10 为空，失败那 5 本
//   **全来自同一个源**（扎堆小说），可读的 5 本全来自另一个源（阅友小说）；
//   用书名重搜后，同一本书在 7 个源里有 4 个能读出正文。
//   ⇒ 根因是**部分源的正文规则失效**，不是链路坏。但产品上有个真坑：
//   ① `getBookContent` 旧顺序「先空等 30 秒、再判 book==null」——而书不在库时
//      chapter 永远不会出现，于是**必然空等满 30 秒**才说「未找到」（体感：卡半分钟）。
//   ② 源失效与其它异常一律吐 `e.stackTraceStr`，前端无法区分，也就给不出「换源」。
//   本版：书不在库立刻返回并说明；缺章节先补建目录再取；`ContentEmptyException`
//   单独标成 `[SOURCE_EMPTY]`（前端据此显示来源名 + 给「换源重搜」出口）。
//   versionCode 由版本号推导 → 11300。
// ★1.13.1（2026-10-03，追补）：把「章节不存在」这个**误导性**提示分家。
//   实测：请求一本引擎库里没有的书，1.13.0 虽已不空等 30 秒（实测 30ms 返回），
//   但报的是 404「章节不存在」—— 而真实原因是「这本书还没进引擎」。
//   两者后果完全不同：前者让用户以为这本书缺章节，后者应该去重新搜索。
//   新增 chapterMissingResponse()：书不在库 → [NEED_REGISTRATION]（并附该做什么），
//   书在但真没这一章 → 才是「章节不存在」。chapters 端点同样处理。
//   versionCode 由版本号推导 → 11301。
def version = "1.13.1"
// versionCode 由版本号推导(1.5.0 → 10500), 保证单调递增、覆盖安装不被降级拦截。
// 以前依赖 git rev-list 的写法在无 git 历史的源码包里会静默回落, 故改为确定性推导。
def versionCodeValue = {
    def p = version.split('\\.')
    (Integer.parseInt(p[0]) * 10000) + (Integer.parseInt(p[1]) * 100) + Integer.parseInt(p[2])
}()
def armOnly = project.findProperty("armOnly")?.toBoolean() ?: false

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    signingConfigs {
        if (project.hasProperty("RELEASE_STORE_FILE")) {
            myConfig {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId "com.legado.app"
        minSdk 23
        targetSdk 36
        versionCode = versionCodeValue
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Keep app translations while dropping unused transitive dependency locales.
        resourceConfigurations += [
                'en',
                'es-rES',
                'ja-rJP',
                'pt-rBR',
                'vi',
                'zh',
                // AndroidX stores Simplified Chinese switch labels under zh-rCN.
                'zh-rCN',
                'zh-rHK',
                'zh-rTW'
        ]
        // ★ 单产物化（2026-10-02，用户指令）：本基座是**一个** Legado 系独立引擎，
        //   不再按内容类型切 flavor、也不再把一个开源项目拆成多个 App。
        //   它天生支持 小说+漫画+音乐+视频 四类内容 —— 「它能支持什么就让它支持什么」，
        //   能力一律保留、不人为阉割。四个独立引擎各有各的上游（Venera/LX Music/TVBox），
        //   各自在自己的仓里出包，与本仓无关。
        manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        manifestPlaceholders.put("app_name", "小说引擎")
        // ★ 引擎身份（单产物化后不再有 BuildConfig.FLAVOR）：
        //   ENGINE_ID 是**引擎清单 downloads/engine/engines.json 里 items[].id 的对应键**，
        //   引擎启动时的更新检查靠它挑出"自己那一条"。此前用的是 BuildConfig.FLAVOR，
        //   而 flavor 一旦拆除，FLAVOR 就不再生成 → 更新检查要么编不过、要么恒挑不到自己那条
        //   （表现是"永远已是最新版本"，静默失效、最难查）。
        buildConfigField "String", "ENGINE_ID", "\"novel\""
        buildConfigField "String", "ENGINE_NAME", "\"小说引擎\""
        buildConfigField "String", "ENGINE_MODULES", "\"novel,comic,music,video\""
        // 空 = 不按类型过滤源（装什么源就搜什么源）
        buildConfigField "String", "ENGINE_SOURCE_TYPES", "\"\""

        project.ext.set("archivesBaseName", name + "_" + version)

        if (armOnly) {
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    buildTypes {
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig = signingConfigs.myConfig
            }
            applicationIdSuffix '.release'
            // ★ app_name 由 defaultConfig 的 manifestPlaceholders 决定（单产物化后
            //   已无 flavor）。AGP 的 manifestPlaceholders 优先级是 buildType >
            //   defaultConfig，所以这里**绝不能**再写 app_name，否则会被覆盖。

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig = signingConfigs.myConfig
            }

            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    // ★ 2026-10-02 单产物化（用户指令）：此处原有的 `flavorDimensions` + 5 个
    //   `productFlavors`（app/novel/comic/music/video）已整体删除。
    //   那 5 个产物共用同一份源码、同一个 applicationId 前缀，在用户眼里就是
    //   「同一个软件切了五份」—— 正是他指出「不要把开源阅读拆分成的四个模块
    //   当成我要的引擎」的那个错误形态（见 docs/PLAN-4.56-ENGINES.md §一）。
    //   现在本仓只出**一个** App：一个 Legado 系独立引擎，四类能力全保留。
    //   四个独立引擎分别来自四个上游，各在自己的仓里构建，不在本仓切分。
    //   （原 app flavor 的四个 buildConfigField/占位符已上移到 defaultConfig。）

    room {
        schemaDirectory "$projectDir/schemas"
    }
    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        resources.excludes.add('META-INF/*')
        // R8 removes the transcode implementation; these bundled resources have no runtime reader.
        resources.excludes.addAll([
                'tables/Transcoder_*.bin',
                '*.proto',
                '**/*.proto',
                'src/**',
                // kotlin-reflect and its builtins loaders are not part of the release runtime.
                'kotlin/*.kotlin_builtins',
                'kotlin/**/*.kotlin_builtins'
        ])
        jniLibs {
            // These dependencies already ship stripped; skip redundant strip attempts.
            keepDebugSymbols += [
                    '**/libandroidx.graphics.path.so',
                    '**/libarchive-jni.so',
                    '**/libdatastore_shared_counter.so',
                    '**/libimage_processing_util_jni.so',
                    '**/librenderscript-toolkit.so',
                    '**/librtmp-jni.so',
                    '**/libsurface_util_jni.so'
            ]
        }
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //忽略string翻译缺失，后面需要翻译时去掉，todo
        disable 'MissingTranslation'
    }
}

