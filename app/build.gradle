apply from: 'download.gradle'
apply from: 'cronet-loader.gradle'

static def releaseTime() {
    return new Date().format("yyMMddHH", TimeZone.getTimeZone("GMT+8"))
}

def name = "reading-engine"
// 阅读引擎自有版本线, 与上游 Legado 版本号解耦
def version = "1.7.0"
// versionCode 由版本号推导(1.5.0 → 10500), 保证单调递增、覆盖安装不被降级拦截。
// 以前依赖 git rev-list 的写法在无 git 历史的源码包里会静默回落, 故改为确定性推导。
def versionCodeValue = {
    def p = version.split('\\.')
    (Integer.parseInt(p[0]) * 10000) + (Integer.parseInt(p[1]) * 100) + Integer.parseInt(p[2])
}()
def armOnly = project.findProperty("armOnly")?.toBoolean() ?: false

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    signingConfigs {
        if (project.hasProperty("RELEASE_STORE_FILE")) {
            myConfig {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId "com.legado.app"
        minSdk 23
        targetSdk 36
        versionCode = versionCodeValue
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Keep app translations while dropping unused transitive dependency locales.
        resourceConfigurations += [
                'en',
                'es-rES',
                'ja-rJP',
                'pt-rBR',
                'vi',
                'zh',
                // AndroidX stores Simplified Chinese switch labels under zh-rCN.
                'zh-rCN',
                'zh-rHK',
                'zh-rTW'
        ]
        project.ext.set("archivesBaseName", name + "_" + version)

        if (armOnly) {
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    buildTypes {
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig = signingConfigs.myConfig
            }
            applicationIdSuffix '.release'
            // ★ app_name 由 productFlavor 决定（见下方 productFlavors）。
            //   AGP 的 manifestPlaceholders 优先级是 buildType > flavor，
            //   所以这里**绝不能**再写 app_name，否则五个产物会全叫「阅读引擎」。

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig = signingConfigs.myConfig
            }

            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    /**
     * 五产物：四合一「阅读引擎」 + 小说/漫画/音乐/视频 四个独立 App。
     *
     *   包名    com.legado.app[.novel|.comic|.music|.video].release
     *   源包    app/src/<flavor>/assets/defaultData/bookSources.json（由 tools/build-engine-source-packs.cjs 生成）
     *
     * ENGINE_MODULES / ENGINE_SOURCE_TYPES 是**编译期**注入的能力白名单，运行期由
     * EngineProfile 读取：只声明本模块的 THP caps、只允许本类型的书源参与搜索。
     */
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
            manifestPlaceholders.put("app_name", "@string/app_name")
            buildConfigField "String", "ENGINE_NAME", "\"阅读引擎\""
            buildConfigField "String", "ENGINE_MODULES", "\"novel,comic,music,video\""
            // 空 = 不按类型过滤（四合一装全部源）
            buildConfigField "String", "ENGINE_SOURCE_TYPES", "\"\""
        }
        novel {
            dimension "mode"
            applicationIdSuffix ".novel"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "novel")
            manifestPlaceholders.put("app_name", "小说引擎")
            buildConfigField "String", "ENGINE_NAME", "\"小说引擎\""
            buildConfigField "String", "ENGINE_MODULES", "\"novel\""
            buildConfigField "String", "ENGINE_SOURCE_TYPES", "\"0,3\""
        }
        comic {
            dimension "mode"
            applicationIdSuffix ".comic"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "comic")
            manifestPlaceholders.put("app_name", "漫画引擎")
            buildConfigField "String", "ENGINE_NAME", "\"漫画引擎\""
            buildConfigField "String", "ENGINE_MODULES", "\"comic\""
            buildConfigField "String", "ENGINE_SOURCE_TYPES", "\"2\""
        }
        music {
            dimension "mode"
            applicationIdSuffix ".music"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "music")
            manifestPlaceholders.put("app_name", "音乐引擎")
            buildConfigField "String", "ENGINE_NAME", "\"音乐引擎\""
            buildConfigField "String", "ENGINE_MODULES", "\"music\""
            buildConfigField "String", "ENGINE_SOURCE_TYPES", "\"1\""
        }
        video {
            dimension "mode"
            applicationIdSuffix ".video"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "video")
            manifestPlaceholders.put("app_name", "视频引擎")
            buildConfigField "String", "ENGINE_NAME", "\"视频引擎\""
            buildConfigField "String", "ENGINE_MODULES", "\"video\""
            buildConfigField "String", "ENGINE_SOURCE_TYPES", "\"4\""
        }
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }
    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        resources.excludes.add('META-INF/*')
        // R8 removes the transcode implementation; these bundled resources have no runtime reader.
        resources.excludes.addAll([
                'tables/Transcoder_*.bin',
                '*.proto',
                '**/*.proto',
                'src/**',
                // kotlin-reflect and its builtins loaders are not part of the release runtime.
                'kotlin/*.kotlin_builtins',
                'kotlin/**/*.kotlin_builtins'
        ])
        jniLibs {
            // These dependencies already ship stripped; skip redundant strip attempts.
            keepDebugSymbols += [
                    '**/libandroidx.graphics.path.so',
                    '**/libarchive-jni.so',
                    '**/libdatastore_shared_counter.so',
                    '**/libimage_processing_util_jni.so',
                    '**/librenderscript-toolkit.so',
                    '**/librtmp-jni.so',
                    '**/libsurface_util_jni.so'
            ]
        }
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //忽略string翻译缺失，后面需要翻译时去掉，todo
        disable 'MissingTranslation'
    }
}

